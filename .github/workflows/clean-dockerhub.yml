name: Docker Hub Cleanup (All Repos)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *' # 4:00 AM IST, this is in UTC

jobs:
  cleanup:
    runs-on: ubuntu-latest

    env:
      KEEP: 3

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Cleanup old Docker Hub tags
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PAT: ${{ secrets.DOCKER_DELETE_TOKEN }}
        run: |
          set -euo pipefail

          HUB_API="https://hub.docker.com/v2"
          REGISTRY="https://registry-1.docker.io"
          AUTH_URL="https://auth.docker.io/token"

          echo "Authenticating to Docker Hub..."

          HUB_TOKEN=$(curl -fsSL -X POST \
            "${HUB_API}/users/login/" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"${DOCKER_USER}\",
              \"password\": \"${DOCKER_PAT}\"
            }" \
            | jq -r '.token')

          if [ -z "$HUB_TOKEN" ] || [ "$HUB_TOKEN" = "null" ]; then
            echo "Failed to authenticate to Docker Hub"
            exit 1
          fi

          echo "Fetching repositories..."

          REPOS=$(curl -fsSL \
            -H "Authorization: JWT ${HUB_TOKEN}" \
            "${HUB_API}/repositories/${DOCKER_USER}/?page_size=100" \
            | jq -r '.results[].name')

          for REPO in $REPOS; do

            echo "========================================"
            echo "Repo: $REPO"

            TAGS=$(curl -fsSL \
              -H "Authorization: JWT ${HUB_TOKEN}" \
              "${HUB_API}/repositories/${DOCKER_USER}/${REPO}/tags/?page_size=100" \
              | jq -r '
                  .results
                  | sort_by(.last_updated)
                  | reverse
                  | .[].name
                ')

            COUNT=$(echo "$TAGS" | sed '/^$/d' | wc -l)

            if [ "$COUNT" -le "$KEEP" ]; then
              echo "Nothing to delete"
              continue
            fi

            DELETE_COUNT=$((COUNT - KEEP))

            echo "Deleting $DELETE_COUNT old tags"

            echo "$TAGS" | tail -n "$DELETE_COUNT" | while read -r TAG; do

              [ -z "$TAG" ] && continue

              if [[ "$TAG" == "latest" || "$TAG" == "prod" ]]; then
                echo "Skipping protected tag: $TAG"
                continue
              fi

              echo "----------------------------------------"
              echo "Processing $REPO:$TAG"

              echo "Getting authenticated registry token..."

              REGISTRY_TOKEN=$(curl -fsSL \
                -u "${DOCKER_USER}:${DOCKER_PAT}" \
                "${AUTH_URL}?service=registry.docker.io&scope=repository:${DOCKER_USER}/${REPO}:pull,push,delete" \
                | jq -r '.token')

              if [ -z "$REGISTRY_TOKEN" ] || [ "$REGISTRY_TOKEN" = "null" ]; then
                echo "Failed to get registry token"
                continue
              fi

              echo "Fetching manifest digest..."

              DIGEST=$(curl -fsSI \
                -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
                -H "Accept: application/vnd.docker.distribution.manifest.v2+json" \
                "${REGISTRY}/v2/${DOCKER_USER}/${REPO}/manifests/${TAG}" \
                | awk 'BEGIN{IGNORECASE=1}/docker-content-digest/ {print $2}' \
                | tr -d '\r')

              if [ -z "$DIGEST" ]; then
                echo "Could not determine digest"
                continue
              fi

              echo "Digest: $DIGEST"

              echo "Attempting registry delete..."

              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
                "${REGISTRY}/v2/${DOCKER_USER}/${REPO}/manifests/${DIGEST}")

              if [ "$HTTP_CODE" = "202" ]; then
                echo "Registry manifest deleted"
              else
                echo "Registry delete failed with HTTP $HTTP_CODE"
                echo "Falling back to Hub tag delete..."

                FALLBACK_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
                  -X DELETE \
                  -H "Authorization: JWT ${HUB_TOKEN}" \
                  "${HUB_API}/repositories/${DOCKER_USER}/${REPO}/tags/${TAG}/")

                if [ "$FALLBACK_CODE" = "204" ]; then
                  echo "Tag deleted successfully"
                else
                  echo "Failed deleting tag (HTTP $FALLBACK_CODE)"
                fi
              fi

            done

          done

          echo "Cleanup completed."