name: Build & Push Microservices to Docker Hub

on:
  push:
    branches: [ "render_codeCleanUp" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [service-registry, department-service, config-server, employee-service, api-gateway]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build JAR
        run: mvn -pl ${{ matrix.service }} -am clean package -DskipTests

      - name: Login to Docker Hub
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest ./${{ matrix.service }}

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest

  deploy-to-render:
    needs: build
    runs-on: ubuntu-latest

    steps:
      # =============================
      # 1. Deploy Config Server
      # =============================
      - name: Deploy Config Server
        run: curl -X POST ${{ secrets.CONFIG_HOOK }}

      - name: Wait for Config Server
        run: |
          for i in {1..30}; do
            status=$(curl -s ${{ secrets.CONFIG_URL }} | grep -c "UP" || true)
            if [ "$status" -gt 0 ]; then
              echo "::notice:: Config Server UP"
              exit 0
            fi
            echo "Waiting Config Server..."
            sleep 10
          done
          exit 1

      # =============================
      # 2. Deploy Service registry (Eureka)
      # =============================
      - name: Deploy Service registry (Eureka) Server
        run: curl -X POST ${{ secrets.SERVICE_HOOK }}

      - name: Wait for Service registry (Eureka) Server
        run: |
          for i in {1..30}; do
            status=$(curl -s ${{ secrets.SERVICE_URL }} | grep -c "UP" || true)
            if [ "$status" -gt 0 ]; then
              echo "::notice:: Service registry (Eureka) Server UP"
              exit 0
            fi
            echo "Waiting Service registry (Eureka) Server..."
            sleep 10
          done
          exit 1

      # =============================
      # 3. Deploy Department Service
      # =============================
      - name: Deploy Department Service
        run: curl -X POST ${{ secrets.DEPARTMENT_HOOK }}

      - name: Wait for Department Service
        run: |
          for i in {1..30}; do
            status=$(curl -s ${{ secrets.DEPARTMENT_URL }} | grep -c "UP" || true)
            if [ "$status" -gt 0 ]; then
              echo "::notice:: Department Service UP"
              exit 0
            fi
            echo "Waiting Department Service..."
            sleep 10
          done
          exit 1

      # =============================
      # 4. Deploy Employee Service
      # =============================
      - name: Deploy Employee Service
        run: curl -X POST ${{ secrets.EMPLOYEE_HOOK }}

      - name: Wait for Employee Service
        run: |
          for i in {1..30}; do
            status=$(curl -s ${{ secrets.EMPLOYEE_URL }} | grep -c "UP" || true)
            if [ "$status" -gt 0 ]; then
              echo "::notice:: Employee Service UP"
              exit 0
            fi
            echo "Waiting Employee Service..."
            sleep 10
          done
          exit 1

      # =============================
      # 5. Deploy API Gateway
      # =============================
      - name: Deploy Gateway
        run: curl -X POST ${{ secrets.GATEWAY_HOOK }}

      - name: Wait for Gateway
        run: |
          for i in {1..30}; do
            status=$(curl -s ${{ secrets.GATEWAY_URL }} | grep -c "UP" || true)
            if [ "$status" -gt 0 ]; then
              echo "::notice:: Gateway UP"
              exit 0
            fi
            echo "Waiting Gateway..."
            sleep 10
          done
          exit 1

      # =============================
      # 7. Final validation
      # =============================
      - name: Final system check
        run: |
          echo "Checking full system health..."

          curl -f ${{ secrets.CONFIG_URL }} || exit 1
          curl -f ${{ secrets.SERVICE_URL }} || exit 1
          curl -f ${{ secrets.DEPARTMENT_URL }} || exit 1
          curl -f ${{ secrets.EMPLOYEE_URL }} || exit 1
          curl -f ${{ secrets.GATEWAY_URL }} || exit 1

          echo -e "\n\n::notice:: ALL SERVICES ARE UP AND HEALTHY"